name: Bench musl (mimalloc vs system)

# One-shot comparison of system allocator vs mimalloc on the musl target.
# CI runners are noisy — treat the deltas as directional, not authoritative.
# Use --quick to keep runtime bounded; that drops sample count, not measurement
# duration, so the signal is still meaningful for ~5%+ effects.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-musl

      - name: Baseline — system allocator
        run: |
          cargo bench --target "$TARGET" -- --quick --save-baseline musl-system \
            2>&1 | tee bench-system.log

      - name: Compare — mimalloc
        run: |
          cargo bench --features mimalloc --target "$TARGET" -- --quick --baseline musl-system \
            2>&1 | tee bench-mimalloc.log

      - name: Summarize deltas
        run: |
          echo "## Bench: system → mimalloc (musl)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '
            /^[a-zA-Z0-9_\/]+$/ { name=$0; next }
            /^[a-zA-Z0-9_\/]+[[:space:]]+time:/ { n=$1; sub(/[[:space:]].*/, "", n); name=n }
            /change:|thrpt:.*%/ {
              line=$0; sub(/^[ \t]+/, "", line)
              if (line ~ /^thrpt:/ && line ~ /%/) tag="thrpt"
              else if (line ~ /^change:/) tag="change"
              else next
              if (match(line, /\[[^]]+\]/)) {
                v=substr(line, RSTART+1, RLENGTH-2); split(v, a, " ")
                printf "%-7s %-10s %s\n", tag, a[2], name
              }
            }
          ' bench-mimalloc.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-musl-logs
          path: |
            bench-system.log
            bench-mimalloc.log
            target/criterion/**/estimates.json
