[package]
name = "rit"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "rit"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
gix = { version = "0.70", features = ["max-performance-safe", "comfort"] }
crossbeam-channel = "0.5"
anyhow = "1"
chrono = "0.4"
compact_str = "0.8"
similar = "2"
clap = { version = "4.6.1", features = ["derive"] }
